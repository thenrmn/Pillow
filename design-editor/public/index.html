<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Editor</title>
<link rel="stylesheet" href="/fonts.css" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header id="topbar">
  <div class="topbar-group">
    <input id="design-name" type="text" value="untitled" spellcheck="false" title="Design name" />
    <select id="preset-select">
      <option value="">Preset size…</option>
      <option value="ig-post">Instagram post — 1080×1080</option>
      <option value="ig-story">Instagram story — 1080×1920</option>
      <option value="x-header">X header — 1500×500</option>
      <option value="a4-poster">A4 poster — 1240×1754 (150dpi)</option>
      <option value="custom">Custom size…</option>
    </select>
  </div>

  <div class="topbar-group">
    <button id="btn-save" title="Save to designs/&lt;name&gt;.json">Save</button>
    <select id="open-select"><option value="">Open design…</option></select>
    <button id="btn-duplicate" title="Duplicate current design as a new file">Duplicate as Template</button>
  </div>

  <div class="topbar-group">
    <button id="btn-export-png1">Export PNG 1x</button>
    <button id="btn-export-png2">Export PNG 2x</button>
    <button id="btn-export-pdf">Export PDF</button>
  </div>
  <div id="status-line"></div>
</header>

<div id="workspace">
  <aside id="toolbar">
    <button id="btn-add-text" title="Add text">Text</button>
    <button id="btn-add-rect" title="Add rectangle">Rectangle</button>
    <button id="btn-add-line" title="Add line">Line</button>
    <label id="btn-add-image" class="file-button" title="Upload image">
      Image
      <input type="file" id="image-input" accept="image/*" hidden />
    </label>
    <hr />
    <button id="btn-center-h" title="Center horizontally">Center H</button>
    <button id="btn-center-v" title="Center vertically">Center V</button>
    <button id="btn-center-both" title="Center on canvas">Center</button>
    <hr />
    <button id="btn-forward" title="Bring forward">Forward</button>
    <button id="btn-backward" title="Send backward">Backward</button>
    <hr />
    <button id="btn-delete" title="Delete selected">Delete</button>
  </aside>

  <main id="canvas-area">
    <div id="canvas-scroll">
      <canvas id="editor-canvas"></canvas>
    </div>
  </main>

  <aside id="side-panel">
    <section id="brand-panel">
      <h3>Brand</h3>
      <div id="brand-colors" class="swatch-row"></div>
      <div id="brand-fonts" class="swatch-row"></div>
    </section>

    <section id="properties-panel">
      <h3>Properties</h3>
      <label class="prop-row">
        Font
        <select id="prop-font-family"></select>
      </label>
      <label class="prop-row">
        Size
        <input type="number" id="prop-font-size" min="4" max="500" />
      </label>
      <label class="prop-row">
        Fill
        <input type="color" id="prop-fill" />
      </label>
      <label class="prop-row">
        Stroke
        <input type="color" id="prop-stroke" />
      </label>
    </section>

    <section id="layers-panel">
      <h3>Layers</h3>
      <ul id="layers-list"></ul>
    </section>
  </aside>
</div>

<div id="custom-size-dialog" class="modal hidden">
  <div class="modal-box">
    <h3>Custom canvas size</h3>
    <label>Width (px) <input type="number" id="custom-width" min="1" value="1080" /></label>
    <label>Height (px) <input type="number" id="custom-height" min="1" value="1080" /></label>
    <div class="modal-actions">
      <button id="custom-size-cancel">Cancel</button>
      <button id="custom-size-ok">Create</button>
    </div>
  </div>
</div>

<script src="/vendor/fabric.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
